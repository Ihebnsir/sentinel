# Backend (backend/) : tests, style, sécurité du code et des dépendances,
# build de l'image Docker. Indépendant du workflow de l'app (ci.yml).
name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml", "render.yaml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml", "render.yaml"]

# Droits minimaux : le workflow ne fait que lire le code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    name: Test, lint, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # Actions épinglées sur un commit précis (le tag est en commentaire).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies (pinned)
        run: python -m pip install --no-deps -r requirements-dev.txt

      - name: Tests (SQLite)
        run: python -m pytest -q

      # PostgreSQL 17 avec TLS (certificat de l'image), comme Neon en production.
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg -p 127.0.0.1:5432:5432             -e POSTGRES_USER=sentinel -e POSTGRES_PASSWORD=sentinel-local -e POSTGRES_DB=sentinel             postgres:17.10-trixie@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317             -c ssl=on             -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem             -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          # Prêt quand il répond en TCP (le serveur d'initialisation n'écoute pas en TCP).
          for i in $(seq 1 60); do
            docker exec pg psql -h 127.0.0.1 -U sentinel -d sentinel -c 'select 1' >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs pg
          exit 1

      - name: Tests (PostgreSQL)
        env:
          SENTINEL_TEST_DATABASE_URL: postgresql://sentinel:sentinel-local@127.0.0.1:5432/sentinel?sslmode=require
        run: python -m pytest -q

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Bandit
        run: bandit -q -c pyproject.toml -r app tools

      - name: pip-audit
        run: pip-audit --no-deps --disable-pip --progress-spinner off -r requirements-dev.txt

      - name: Docker build
        run: docker build -t sentinel-backend:ci .
