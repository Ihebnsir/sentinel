# Backend (backend/) : tests, style, sécurité du code et des dépendances,
# build de l'image Docker. Indépendant du workflow de l'app (ci.yml).
name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

# Droits minimaux : le workflow ne fait que lire le code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    name: Test, lint, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # Actions épinglées sur un commit précis (le tag est en commentaire).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies (pinned)
        run: python -m pip install --no-deps -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Bandit
        run: bandit -q -c pyproject.toml -r app

      - name: pip-audit
        run: pip-audit --no-deps --disable-pip --progress-spinner off -r requirements-dev.txt

      - name: Docker build
        run: docker build -t sentinel-backend:ci .
