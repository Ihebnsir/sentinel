# Intégration continue : analyse, tests et build APK debug à chaque
# push et pull request vers main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Droits minimaux : le workflow ne fait que lire le code.
permissions:
  contents: read

# Un nouveau push annule l'exécution précédente de la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # Actions épinglées sur un commit précis (le tag est en commentaire).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug
