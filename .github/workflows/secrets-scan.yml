# Recherche de secrets (clés, jetons, mots de passe) dans TOUT
# l'historique Git à chaque push, avec Gitleaks.
name: Secrets scan

on:
  push:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz (fichier checksums.txt
      # de la release officielle). Le téléchargement est refusé s'il diffère.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # Faux positifs vérifiés : voir .gitleaksignore à la racine.
      - name: Scan full history
        run: gitleaks git . --redact --verbose --exit-code 1
